name: Validate and deploy personal app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_REPO_APPS_FAKE: "0"
      PUBLIC_REPO_OWNER: ${{ github.repository_owner }}
      PUBLIC_REPO_NAME: ${{ github.event.repository.name }}
      PUBLIC_REPO_BRANCH: ${{ github.event.repository.default_branch }}
      PUBLIC_APP_VERSION: ${{ github.sha }}
      PUBLIC_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Validate public build inputs
        run: pnpm validate:data

      - uses: actions/configure-pages@v6

      - name: Build static application
        run: pnpm build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
