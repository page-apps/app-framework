name: Validate private app data

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "schemas/**"
      - "scripts/**"
      - ".github/workflows/validate-data.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: private-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate canonical data
        run: node scripts/validate-data.mjs

      - name: Generate private indexes
        run: node scripts/generate-index.mjs

      - name: Commit changed generated files
        run: |
          git add generated
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate private data indexes"
          git push
